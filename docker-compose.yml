# SYNHA — vijya-hospital full deployment (mirrors Restarunt's docker-compose)
# Start:  docker compose up -d
# Stop:   docker compose down
#
# Secrets come from ./backend/.env (env_file). The MONGODB_URI and REDIS_URL
# below are overridden to point at the bundled containers so the stack is
# self-contained on any Docker-capable VPS. Host ports (27018/6380) differ
# from Restarunt's (27017/6379) so both stacks can run on the same host.

version: '3.8'

services:
  # MongoDB
  mongodb:
    image: mongo:6.0
    container_name: vijya-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USERNAME:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-change_this_in_production}
      MONGO_INITDB_DATABASE: vijya
    ports:
      - "127.0.0.1:27018:27017"
    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb
    networks:
      - vijya-network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis (ioredis — vijya falls back to in-memory if absent, but bundled for parity)
  redis:
    image: redis:7-alpine
    container_name: vijya-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6380:6379"
    volumes:
      - redis_data:/data
    networks:
      - vijya-network
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API + WhatsApp bot
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: vijya-backend
    restart: unless-stopped
    ports:
      - "5050:5050"
    environment:
      NODE_ENV: production
      PORT: 5050
      # Override .env to use the bundled containers (self-contained deploy)
      MONGODB_URI: "mongodb://${MONGO_USERNAME:-admin}:${MONGO_PASSWORD:-change_this_in_production}@mongodb:27017/vijya?authSource=admin"
      REDIS_URL: "redis://redis:6379"
    env_file:
      - ./backend/.env
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - vijya-network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:5050/api/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  vijya-network:
    driver: bridge

volumes:
  mongodb_data:
    driver: local
  mongodb_config:
    driver: local
  redis_data:
    driver: local
